# projects.repos.conf — where a project comes from when it is not on this machine yet.
#
# Read by `cc_repo_url` in `_lib.sh`. If the directory of a config entry is missing,
# `cc_clone_missing` fetches it from here and then starts the session as usual.
#
# Form:  <name as in projects.<host>.conf>|<clone address>
#        <name>|-        means explicitly "not a git project" — it is never cloned.
#
# WHY NOT IN THE PROJECT CONFIG: that file is the list, and it exists **per machine** (the
# paths diverge between machines). The clone address is the same everywhere. Two copies of
# one address are two places where it can go stale.
#
# Collect the real values from the machine that already has the clones, one line per entry:
#
#   git -C <path> remote get-url vps 2>/dev/null || git -C <path> remote get-url origin
#
# Do NOT assemble addresses from project names. Four things a name cannot tell you, all of
# them seen in one real fleet of 22 projects:
#
#   1. Local remotes that only exist on one machine (a path, not a server) — take the
#      upstream remote, never those.
#   2. Namespaces: two groups on the same host carried eight projects between them, and
#      nothing in the project name says which.
#   3. Letter case: a project listed as `rockabulls` is `Rockabulls` in the repository.
#   4. Second checkouts: two entries can legitimately point at the SAME repository.
#
# A guessed address does not fail loudly. It 404s — or, worse, it finds a same-named
# foreign repository, clones it, and the session starts in it.

assistant|ssh://git.example.org/srv/git/assistant.git
notes|ssh://git.example.org/srv/git/notes.git

website|https://gitlab.example.com/acme/website.git
tooling|https://gitlab.example.com/acme-tools/tooling.git
mailer|https://github.com/acme/mailer.git

# Synced folders (cloud drive): they arrive through the sync client, not through a clone.
# If such a folder is missing, the sync is still loading or it is not marked offline.
receipts|-
health|-
