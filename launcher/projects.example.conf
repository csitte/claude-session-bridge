# projects.example.conf — the project LIST for ONE machine.
#
# Copy to projects.<hostname>.conf; the launcher picks the file matching this host.
# DATA ONLY — the mechanics live in _lib.sh. That split is deliberate: the mechanics
# stay identical across machines, and everything machine- or person-specific is
# confined to this file (see docs/lessons.md, lesson 8).
#
# Format: "Name|working-dir|extra claude args|instructions=<key>"
#   Name             window title AND the session id used by the bridge/watcher
#   working-dir      msys-style path (/c/... on Windows)
#   extra args       optional, passed to claude as-is, e.g. --add-dir for directories
#                    outside the project. Directories given that way are pulled before
#                    the start too, if they are git working trees.
#   instructions=    optional, 4th field: the project keeps its CLAUDE.md OUTSIDE its own
#                    repository, in a clone of your instructions repository under
#                    <clone>/<key>/CLAUDE.md. The launcher copies it in before the start
#                    (see cc_instructions_before_start in _lib.sh). Without the field
#                    nothing happens — only the declaration makes a MISSING file reportable.
#
# WHICH projects start on a fleet start is NOT decided here. This file is only the LIST.
# The selection lives in autostart.<hostname>.local next to this file (not in git), one
# project name per line, written by the session manager. If that file is missing on a
# machine, the fleet start starts nothing and opens the session manager -- tick, save.
# There is no "#off " prefix: such a line would be a comment to bash and the entry
# invisible; the launcher and the manager report one out loud instead of reading it.
# A project that is not selected is not second-class: it starts on its own
# (start-one.sh, or "Start selected" in the manager) and joins the push layer the moment
# it runs, because arming happens on its first turn -- not from this file.

projects=(
  "app|/c/code/app|--add-dir \"$HOME/session-bridge\""
  "app-b|/c/code/app-b|--add-dir \"$HOME/session-bridge\""
  "docs|/c/code/docs|--add-dir \"$HOME/session-bridge\" --add-dir /c/code/app"
  "notes|/c/notes|--add-dir \"$HOME/session-bridge\"|instructions=notes"
  "scratch|/c/code/scratch|--add-dir \"$HOME/session-bridge\""
)
