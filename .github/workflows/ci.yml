name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The delivery core is plain POSIX shell: without powershell.exe the watcher simply
  # skips its process inventory. So the protocol half of this repository is testable on
  # Linux — which is also the evidence behind the README's claim that the core is
  # portable while the process hygiene is not.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version
          # Fail on errors; warnings are printed but do not block. The scripts contain
          # deliberate word splitting (comma-separated recipient lists), marked with
          # targeted disable directives where it happens.
          shellcheck --severity=error --shell=bash \
            bridge/*.sh launcher/*.sh tests/run.sh
          echo "--- warnings (non-blocking) ---"
          shellcheck --severity=warning --shell=bash \
            bridge/*.sh launcher/*.sh tests/run.sh || true

      - name: tests
        run: bash tests/run.sh

  # Everything that touches processes, windows and the registry of running sessions is
  # Windows-only. This job proves the scripts at least parse and the suite passes under
  # Git Bash, which is the environment the launcher actually targets.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: tests (Git Bash)
        shell: bash
        run: bash tests/run.sh

      - name: PowerShell parser (7)
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem launcher/*.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { $bad += $e.Count; Write-Host "$($_.Name): $($e.Count) parse error(s)" }
            else { Write-Host "$($_.Name): ok" }
          }
          if ($bad) { exit 1 }

      # The same check under WINDOWS POWERSHELL 5.1 (`shell: powershell`), and it is not
      # redundant: 5.1 reads a BOM-less UTF-8 file as ANSI, so a non-ASCII character inside
      # a DOUBLE-quoted string breaks the file — an em dash decodes to three CP1252
      # characters whose third one (0x94) is a closing quotation mark, which PowerShell
      # accepts as a string delimiter. The string ends early and the rest of the line
      # becomes code.
      #
      # Measured, both directions: a double-quoted em dash gives 2 parse errors under 5.1
      # and 0 under 7 — so the job above cannot see this class at all. In a SINGLE-quoted
      # string 5.1 gives 0 errors too and merely mangles the text, which is the quieter
      # half of the same problem and the reason the rule looks arbitrary in the source.
      - name: PowerShell parser (Windows PowerShell 5.1, catches the ANSI trap)
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem launcher/*.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { $bad += $e.Count; Write-Host "$($_.Name): $($e.Count) parse error(s)" }
            else { Write-Host "$($_.Name): ok" }
          }
          if ($bad) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path launcher -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
          Write-Host "no errors"
